name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Phase1_Rerun/project2

jobs:
  test:
    name: Test Python application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FLASK_ENV: testing
      FLASK_APP: run.py
      SECRET_KEY: ci-only-flask-secret-not-for-production
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finance_tracker_test

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finance_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Phase1_Rerun/project2/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply database migrations
        run: python -m flask db upgrade

      - name: Show applied migration
        run: python -m flask db current

      - name: Prepare test evidence directory
        run: mkdir -p test-results

      - name: Run critical confidence tests
        run: |
          python -m pytest \
            -m critical \
            --maxfail=1 \
            --junitxml=test-results/critical-junit.xml

      - name: Run complete test suite with coverage
        run: |
          python -m pytest \
            --junitxml=test-results/junit.xml \
            --cov=app \
            --cov=bot \
            --cov-report=term-missing \
            --cov-report=xml:test-results/coverage.xml \
            --cov-fail-under=70

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-evidence-${{ github.run_attempt }}
          path: Phase1_Rerun/project2/test-results/
          if-no-files-found: warn
          retention-days: 14
  docker:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build --tag moneytiq-ci:${{ github.sha }} .

      - name: Verify packaged Python application
        run: |
          docker run \
            --rm \
            --entrypoint python \
            moneytiq-ci:${{ github.sha }} \
            -m compileall -q app bot

      - name: Start application container
        run: |
          docker run \
            --detach \
            --name moneytiq-smoke \
            --publish 127.0.0.1:5000:5000 \
            --env FLASK_ENV=testing \
            --env TEST_DATABASE_URL=postgresql://postgres:postgres@database.invalid:5432/finance_tracker_test \
            --env WEB_CONCURRENCY=1 \
            moneytiq-ci:${{ github.sha }}

      - name: Verify container serves HTTP
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5000/health; then
              exit 0
            fi
            sleep 1
          done

          echo "Container did not become healthy."
          docker logs moneytiq-smoke
          exit 1

      - name: Stop smoke-test container
        if: always()
        run: docker rm --force moneytiq-smoke 2>/dev/null || true