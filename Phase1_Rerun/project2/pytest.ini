[pytest]
pythonpath = .
testpaths =
    tests
    bot/tests
python_files = test_*.py
addopts = -q --disable-warnings --strict-markers
markers =
    no_database: unit test that does not require PostgreSQL
    integration: test that requires Flask and PostgreSQL
    external: test of a mocked third-party service boundary
    critical: essential API confidence spine for fast CI debugging
